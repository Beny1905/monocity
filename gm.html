function mlSend(){ var v = function(id){ var x = $('#'+id); return x ? x.value : ''; }, k = v('mK'), ti = v('mT').trim(), tx = v('mX').trim(), ed = Math.max(0, parseInt(v('mE'), 10) || 0), now = Date.now(), DAY = 864e5;
  if(ti.length < 2){ toast('Başlık yaz.'); return; } var m = {k:k, ti:ti, tx:tx, ts:now, by:ME}; if(ed) m.exp = now + ed*DAY;

function pOd(W){ var O = G.od, p = G.P, sel = Object.keys(O.sel), T = KAT.tabs.filter(function(t){ return t.k === O.tab; })[0] || {it:[]}, q = O.q.toLowerCase();

    '<div class="card"><h4>Para / parça</h4><div class="grid">'+CURP.map(function(c){ return '<div><label>'+c[1]+'</label><input data-oc="'+c[0]+'" inputmode="numeric" placeholder="0" value="'+esc(O.cur[c[0]] || '')+'"></div>'; }).join('')+'</div></div>'+
    '<div class="card"><h4>Eşyalar <span class="mt">seçilen: '+sel.length+'</span></h4><div class="sub" style="padding:0 0 8px">'+KAT.tabs.map(function(t){ return '<a data-ot="'+t.k+'" class="'+(t.k === O.tab ? 'on' : '')+'">'+esc(t.n)+'</a>'; }).join('')+'</div>'+
    '<div class="mt">Şablon: </div><div class="row" style="margin:6px 0">'+KAT.tpl.map(function(t){ return '<button data-otp="'+t.k+'" style="padding:6px 9px;font-size:11px">'+esc(t.n)+'</button>'; }).join('')+'<button data-otp="-" style="padding:6px 9px;font-size:11px" class="r">SEÇİMİ TEMİZLE</button></div>'+
    '<input id="odS" placeholder="🔍 ara…" value="'+esc(O.q)+'"><div class="its">'+(L.map(function(x){ return '<div data-oi="'+esc(x[0])+'" class="'+(O.sel[x[0]] ? 'on' : '')+'">'+esc(x[1])+'</div>'; }).join('') || '<span class="mt">Sonuç yok</span>')+'</div>'+
    (sel.length ? '<div class="note">Seçilenler: '+sel.map(function(k){ return esc(kName(k)); }).join(', ')+'</div>' : '')+'</div>'+
    '<div class="card"><label>Başlık</label><input id="odT" maxlength="60" value="'+esc(O.ti || '')+'" placeholder="🎁 Ödülün geldi!"><label>Mesaj</label><textarea id="odX" maxlength="300">'+esc(O.tx || '')+'</textarea><label>Son alma (gün, 0 = süresiz)</label><input id="odE" inputmode="numeric" value="'+esc(O.ex || '')+'"><div class="row" style="margin-top:10px"><button class="g" id="odG"'+(p ? '' : ' disabled')+'>🎁 GÖNDER'+(p ? ' · '+esc(p.d.nickname || '') : '')+'</button></div></div>'; }
function odSend(){ var O = G.od, p = G.P; if(!p) return; var it = Object.keys(O.sel), rw = {}; Object.keys(O.cur).forEach(function(k){ var n = Math.max(0, Math.min(10000000, parseInt(O.cur[k], 10) || 0)); if(n) rw[k] = n; });
  if(!it.length && !Object.keys(rw).length){ toast('Eşya ya da miktar seç.'); return; }
  var ti = String($('#odT').value || '').trim().slice(0, 60) || '🎁 Ödülün geldi!', tx = String($('#odX').value || '').trim().slice(0, 300), ex = Math.max(0, parseInt($('#odE').value, 10) || 0), now = Date.now();
  var m = {ti:ti, tx:tx, ts:now, pid:'', ap:0, a:'', rw:rw, it:it}; if(ex) m.exp = now + ex*864e5;
  db.ref('pmail/'+p.u).push(m).then(function(){ toast('📮 Ödül postası gönderildi: '+(p.d.nickname || 'Oyuncu')); O.sel = {}; O.cur = {}; O.ti = ''; O.tx = ''; paint(); }).catch(function(){ toast('❌ Gönderilemedi (yetki?).'); }); }
/* ---------- SOHBET ---------- */
var chOff = null, CH = [];
function pCh(W){ W.innerHTML = '<div class="card"><h4>💬 Global sohbet (canlı)</h4><div class="note">Mesajı silince tüm oyuncularda gizlenir.</div></div><div id="chL"></div>';
  if(chOff) chOff(); CH = []; var q = db.ref('chat/global').limitToLast(40), f = function(s){ var v = s.val() || {}; CH = Object.keys(v).sort().map(function(k){ var m = v[k]; m.__k = k; return m; }).reverse(); var e = $('#chL'); if(!e || tab !== 'ch') return;
    e.innerHTML = CH.map(function(m){ return '<div class="card"><div class="mt">'+esc(m.n || 'Oyuncu')+' · '+ago(m.ts)+' önce</div><div class="tx">'+esc(m.t)+'</div><div class="row"><button class="r" data-cdel="'+esc(m.__k)+'">🗑️ SİL</button><button data-pl="'+esc(m.u)+'">👤 OYUNCU</button></div></div>'; }).join('') || '<div class="emp">Sohbette mesaj yok.</div>'; };
  q.on('value', f); chOff = function(){ q.off('value', f); chOff = null; }; }
/* ---------- ETKİNLİKLER ---------- */
function pEv(W){ if(!EVM.length){ W.innerHTML = '<div class="emp">Etkinlik araçları hazırlanıyor.</div>'; return; }
  $('#S').innerHTML = '<div class="sub">'+EVM.map(function(e, i){ return '<a data-ev="'+i+'" class="'+(i === G.ev ? 'on' : '')+'">'+esc(e.n)+'</a>'; }).join('')+'</div>';

function evRun(i, b){ var E = EVM[G.ev], a = E.a[i], u = G.P ? G.P.u : ME; var go = function(){ db.ref('users/'+u+'/gmSet').set({ts:Date.now(), mac:(E.pre || []).concat(a.m), ml:E.n+' · '+a.n}).then(function(){ toast('✅ Komut gönderildi: '+a.n); }).catch(function(){ toast('❌ Gönderilemedi. (Kurallar güncel mi?)'); }); }; if(a.c === 'r') sure(b, go); else go(); }

/* ---------- tıklamalar ---------- */
document.addEventListener('click', function(e){ var t = e.target, b;
  if((b = t.closest('[data-pl]'))){ G.plQ = ''; openPl(b.getAttribute('data-pl')); return; }
  if((b = t.closest('.card[data-k] [data-a]'))){ var k = b.closest('.card').getAttribute('data-k'), r = G.R[k], a = b.getAttribute('data-a'); if(!r) return; var go = function(){ act(a, r, k, b); }; if(BAN[a]) sure(b, go); else go(); return; }
  if((b = t.closest('[data-ph]'))){ var k2 = b.getAttribute('data-ph'), r2 = G.R[k2], key = r2.t === 'pp' ? 'users/'+r2.u+'/avu' : 'album/'+r2.u+'/'+(r2.p || '')+'/img'; once(key).then(function(x){ $('#ph_'+CSS.escape(k2)).innerHTML = x ? '<img class="ph" alt="" src="'+esc(x)+'">' : '<div class="mt">Fotoğraf bulunamadı (silinmiş olabilir).</div>'; }).catch(function(){ toast('❌ Okunamadı.'); }); return; }
  if((b = t.closest('[data-apa]'))){ if(b.__busy) return; b.__busy = 1; var d = b.getAttribute('data-apa'), u = b.getAttribute('data-u'), pid = b.getAttribute('data-pid');
    var p = d === 'ok' ? revert(u, pid, 'ap').then(function(){ return Promise.all([db.ref('appeals/'+u+'/'+pid+'/st').set('ok'), mailTo(u, pid, '✅ İtirazın kabul edildi', 'İtirazın GM tarafından incelendi ve kabul edildi.\nCezan kaldırıldı. Anlayışın için teşekkürler!', false)]); })
      : Promise.all([db.ref('appeals/'+u+'/'+pid+'/st').set('no'), mailTo(u, pid, '❌ İtirazın reddedildi', 'İtirazın GM tarafından incelendi ve reddedildi.\nCeza geçerliliğini koruyor. Bu ceza için tekrar itiraz edilemez.', false)]);
    p.then(function(){ toast(d === 'ok' ? '✅ İtiraz kabul edildi, ceza kaldırıldı.' : '❌ İtiraz reddedildi.'); return reload(); }).catch(function(){ b.__busy = 0; toast('❌ İşlem yapılamadı.'); }); return; }
  if((b = t.closest('[data-cz]'))){ G.cz = b.getAttribute('data-cz'); paint(); return; }
  if((b = t.closest('[data-rev]'))){ sure(b, function(){ revert(b.getAttribute('data-u'), b.getAttribute('data-rev'), 'gm').then(function(){ toast('↩️ Ceza geri alındı.'); return reload(); }).catch(function(){ toast('❌ Geri alınamadı.'); }); }); return; }
  if((b = t.closest('[data-sp]'))){ var id = b.getAttribute('data-sp'); G.sel = G.sel === id ? null : id; pSp($('#W')); return; }
  if((b = t.closest('[data-spa]'))){ var pr = b.getAttribute('data-id').split('|'), ref = db.ref('support/'+pr[0]+'/'+pr[1]), sa = b.getAttribute('data-spa'), now = Date.now();
    if(sa === 'rep'){ var v = ($('#spT').value || '').trim(); if(v.length < 2){ toast('Yanıt yaz.'); return; } var up = {}; up['m/m'+now] = {b:'g', t:v.slice(0, 1000), ts:now}; up.up = now; up.st = 'ans'; up.ur = true; ref.update(up).then(function(){ toast('📨 Yanıt gönderildi.'); return reload(); }).catch(function(){ toast('❌ Gönderilemedi.'); }); }
    else if(sa === 'done'){ ref.update({st:'done', up:now, ur:true}).then(function(){ toast('✓ Çözüldü olarak işaretlendi.'); G.sel = null; return reload(); }).catch(function(){ toast('❌ Kaydedilemedi.'); }); }
    else if(sa === 'del'){ sure(b, function(){ ref.remove().then(function(){ toast('🗑️ Talep silindi.'); G.sel = null; return reload(); }).catch(function(){ toast('❌ Silinemedi.'); }); }); } return; }
  if(t.id === 'plB' || t.id === 'odB' || t.id === 'evB'){ var qi = $(t.id === 'plB' ? '#plQ' : (t.id === 'odB' ? '#odQ' : '#evQ')); G.plQ = qi.value.trim(); G.P = null; if(!G.plQ){ paint(); return; } G.plBusy = 1; findPl(G.plQ).then(function(p){ G.plBusy = 0; G.P = p; if(!p) toast('Oyuncu bulunamadı.'); paint(); }); return; }
  if((b = t.closest('[data-pa]'))){ plAct(b); return; }
  if(t.id === 'klB'){ G.klQ = $('#klQ').value.replace(/\D/g, ''); if(G.klQ) klFind(); return; }
  if((b = t.closest('[data-ka]'))){ var ka = b.getAttribute('data-ka'); if(!G.C) return; if(ka === 'save'){ var nno = num('gpCn'), pp = num('gpCp'); if(!nno && pp == null){ toast('Yeni ID veya puan yaz.'); return; } klSave(nno, pp == null ? null : Number(pp)); } else if(ka === 'p') klSave(null, (Number(G.C.c.pts) || 0) + Number(b.getAttribute('data-v'))); else if(ka === 'chat') sure(b, function(){ db.ref('clubChat/'+G.C.id).remove().then(function(){ toast('🗑️ Kulüp sohbeti temizlendi.'); }).catch(function(){ toast('❌ Silinemedi.'); }); }); return; }
  if(t.id === 'mS'){ mlSend(); return; }

  if((b = t.closest('[data-ot]'))){ G.od.tab = b.getAttribute('data-ot'); G.od.q = ''; pOd($('#W')); return; }
